name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: theos/setup-theos@v1

    - name: Build Package
      run: |
        make package FINALPACKAGE=1

    - name: Upload .deb
      uses: actions/upload-artifact@v4
      with:
        name: iPadIsland-deb
        path: packages/*.deb
